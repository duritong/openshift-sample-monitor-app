---
apiVersion: v1
kind: Service
metadata:
  name: backend-headless
  labels:
    app: backend-app
spec:
  clusterIP: None
  ports:
  - port: 8080
    name: web
  selector:
    app: backend-app
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app: backend-app
spec:
  ports:
  - port: 8080
    name: web
    targetPort: 8080
  selector:
    app: backend-app
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: backend
spec:
  to:
    kind: Service
    name: backend
  port:
    targetPort: web
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: backend-app
spec:
  serviceName: "backend-headless"
  replicas: 3
  selector:
    matchLabels:
      app: backend-app
  template:
    metadata:
      labels:
        app: backend-app
    spec:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: "topology.kubernetes.io/zone"
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: backend-app
      containers:
      - name: web
        image: registry.access.redhat.com/ubi9/ubi:latest
        command: ["python3", "/app/backend-app.py"]
        env:
        - name: APP_MODE
          value: "web"
        - name: DATA_DIR
          value: "/data"
        - name: WRITE_INTERVAL
          value: "60"
        ports:
        - containerPort: 8080
          name: web
        volumeMounts:
        - name: data
          mountPath: /data
        - name: script
          mountPath: /app
        resources:
          requests:
            cpu: "50m"
            memory: "32Mi"
          limits:
            cpu: "200m"
            memory: "64Mi"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 65
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 5
      - name: writer
        image: registry.access.redhat.com/ubi9/ubi:latest
        command: ["python3", "/app/backend-app.py"]
        env:
        - name: APP_MODE
          value: "writer"
        - name: DATA_DIR
          value: "/data"
        - name: WRITE_INTERVAL
          value: "60"
        volumeMounts:
        - name: data
          mountPath: /data
        - name: script
          mountPath: /app
        resources:
          requests:
            cpu: "50m"
            memory: "32Mi"
          limits:
            cpu: "200m"
            memory: "64Mi"
      - name: quorum
        image: registry.access.redhat.com/ubi9/ubi:latest
        command: ["python3", "/app/backend-app.py"]
        env:
        - name: APP_MODE
          value: "quorum"
        - name: DATA_DIR
          value: "/data"
        - name: QUORUM_INTERVAL
          value: "5"
        - name: REPLICAS
          value: "3"
        - name: STATEFULSET_NAME
          value: "backend-app"
        - name: SERVICE_NAME
          value: "backend-headless"
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        volumeMounts:
        - name: data
          mountPath: /data
        - name: script
          mountPath: /app
        resources:
          requests:
            cpu: "50m"
            memory: "32Mi"
          limits:
            cpu: "200m"
            memory: "64Mi"
      volumes:
      - name: script
        configMap:
          name: app-config
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi
